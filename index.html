<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CentroWeb Online | Tu negocio activo en Google Maps</title>
  <meta name="description" content="Hacemos que tu negocio se vea activo en Google Maps. Atendemos tus clientes por ti en tu perfil de Google Maps." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            royal: {
              DEFAULT: '#0033A0',
              bright: '#0044CC',
              medium: '#1E64E8',
              soft: '#D6E6FF',
              ice: '#EBF3FF',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Garantiza altura exacta de pantalla sin scroll vertical ni horizontal */
    html, body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #FFFFFF 0%, #EBF3FF 65%, #D6E6FF 100%);
    }

    /* Tipografía fluida con clamp() para ajuste perfecto en celular y PC sin desbordar */
    .headline-top {
      font-size: clamp(1.38rem, 3.6vh + 1.4vw, 2.75rem);
      line-height: 1.14;
      letter-spacing: -0.025em;
    }

    .headline-sub {
      font-size: clamp(1.02rem, 2.2vh + 0.95vw, 1.65rem);
      line-height: 1.3;
      letter-spacing: -0.015em;
    }

    .cta-text {
      font-size: clamp(0.95rem, 1.9vh + 0.7vw, 1.3rem);
    }

    /* Animación suave de flotación y pulso para el pin rojo de ubicación */
    @keyframes floatPin {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes radarPulse {
      0% {
        transform: scale(0.75);
        opacity: 0.75;
      }
      100% {
        transform: scale(2.1);
        opacity: 0;
      }
    }

    .pin-float {
      animation: floatPin 2.6s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .pin-pulse {
      animation: radarPulse 2.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      transform-origin: 210px 128px;
    }
  </style>
</head>
<body class="text-[#0033A0] select-none">

  <!-- Contenedor principal 100dvh distribuido equilibradamente sin scroll -->
  <main class="w-full h-full max-w-4xl mx-auto px-4 sm:px-8 py-3 sm:py-6 flex flex-col justify-evenly items-center text-center">

    <!-- 1. SENTENCIA SUPERIOR -->
    <header class="w-full max-w-3xl shrink-0">
      <h1 class="headline-top font-black text-[#0033A0]">
        Hacemos que tu negocio se vea activo en <span class="text-[#1E64E8]">Google Maps.</span>
      </h1>
    </header>

    <!-- 2. ILUSTRACIÓN SVG ESTILO GOOGLE MAPS CON MANZANAS, NEGOCIOS Y GOTA ROJA -->
    <section aria-label="Ilustración de negocio destacado en Google Maps" class="w-full max-w-[340px] sm:max-w-[440px] md:max-w-[480px] flex-shrink flex items-center justify-center my-1">
      <div class="w-full rounded-2xl sm:rounded-3xl bg-white p-1.5 sm:p-2 shadow-[0_14px_35px_rgba(0,51,160,0.14)] border-2 border-[#D6E6FF]">
        <svg viewBox="0 0 420 220" class="w-full h-auto max-h-[29dvh] sm:max-h-[32dvh] rounded-xl sm:rounded-2xl block" xmlns="http://www.w3.org/2000/svg" role="img">
          <defs>
            <!-- Sombra suave para el pin rojo -->
            <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="160%">
              <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#7F1D1D" flood-opacity="0.35"/>
            </filter>
            <!-- Gradiente del pin rojo clásico de Google Maps -->
            <linearGradient id="redPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#EA4335"/>
              <stop offset="100%" stop-color="#C5221F"/>
            </linearGradient>
          </defs>

          <!-- Fondo base del mapa (manzanas / cuadras tono crema claro y celeste suave) -->
          <rect width="420" height="220" fill="#F4F7FC"/>

          <!-- Parque / Área verde sutil (superior izquierda) -->
          <rect x="14" y="12" width="102" height="58" rx="8" fill="#DCFCE7"/>
          <!-- Árboles decorativos minimalistas en el parque -->
          <circle cx="36" cy="34" r="7" fill="#86EFAC"/>
          <circle cx="54" cy="48" r="6" fill="#4ADE80"/>
          <circle cx="92" cy="30" r="8" fill="#86EFAC"/>

          <!-- Manzana residencial/comercial inferior izquierda -->
          <rect x="14" y="92" width="102" height="54" rx="8" fill="#E8EEF8"/>
          <!-- Bloques de locales -->
          <rect x="24" y="102" width="36" height="34" rx="5" fill="#DCE6F7" stroke="#CBD5E1" stroke-width="1"/>
          <rect x="68" y="102" width="38" height="34" rx="5" fill="#DCE6F7" stroke="#CBD5E1" stroke-width="1"/>

          <!-- Manzana inferior izquierda esquina -->
          <rect x="14" y="168" width="102" height="42" rx="8" fill="#E8EEF8"/>
          <rect x="26" y="177" width="78" height="24" rx="5" fill="#DCE6F7"/>

          <!-- Manzana central superior -->
          <rect x="142" y="12" width="136" height="58" rx="8" fill="#E8EEF8"/>
          <rect x="154" y="22" width="50" height="38" rx="5" fill="#DCE6F7"/>
          <rect x="214" y="22" width="52" height="38" rx="5" fill="#DCE6F7"/>

          <!-- MANZANA CENTRAL PRINCIPAL (Donde está el negocio destacado) -->
          <rect x="142" y="92" width="136" height="54" rx="8" fill="#E2ECFC"/>
          <!-- Local vecino izquierdo -->
          <rect x="150" y="102" width="34" height="34" rx="5" fill="#D2E1FA"/>
          <!-- NEGOCIO DESTACADO EN EL CENTRO -->
          <rect x="190" y="99" width="40" height="40" rx="7" fill="#FFFFFF" stroke="#1E64E8" stroke-width="2.2"/>
          <!-- Local vecino derecho -->
          <rect x="236" y="102" width="34" height="34" rx="5" fill="#D2E1FA"/>

          <!-- Manzana central inferior -->
          <rect x="142" y="168" width="136" height="42" rx="8" fill="#E8EEF8"/>
          <rect x="156" y="177" width="48" height="24" rx="5" fill="#DCE6F7"/>
          <rect x="214" y="177" width="50" height="24" rx="5" fill="#DCE6F7"/>

          <!-- Manzana superior derecha -->
          <rect x="304" y="12" width="102" height="58" rx="8" fill="#E8EEF8"/>
          <rect x="316" y="22" width="78" height="38" rx="5" fill="#DCE6F7"/>

          <!-- Manzana central derecha (con área verde pequeña) -->
          <rect x="304" y="92" width="102" height="54" rx="8" fill="#E8EEF8"/>
          <rect x="314" y="102" width="44" height="34" rx="5" fill="#DCE6F7"/>
          <rect x="366" y="102" width="30" height="34" rx="5" fill="#DCFCE7"/>

          <!-- Manzana inferior derecha -->
          <rect x="304" y="168" width="102" height="42" rx="8" fill="#E8EEF8"/>
          <rect x="316" y="177" width="78" height="24" rx="5" fill="#DCE6F7"/>

          <!-- CALLES Y AVENIDAS BLANCAS CON BORDES SUTILES -->
          <!-- Calles horizontales -->
          <rect x="0" y="70" width="420" height="22" fill="#FFFFFF"/>
          <line x1="0" y1="70" x2="420" y2="70" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="0" y1="92" x2="420" y2="92" stroke="#CBD5E1" stroke-width="1"/>

          <!-- Avenida principal inferior (tono amarillo suave clásico de Maps) -->
          <rect x="0" y="146" width="420" height="22" fill="#FEF08A"/>
          <line x1="0" y1="146" x2="420" y2="146" stroke="#FACC15" stroke-width="1.2"/>
          <line x1="0" y1="168" x2="420" y2="168" stroke="#FACC15" stroke-width="1.2"/>

          <!-- Calles verticales -->
          <rect x="116" y="0" width="26" height="220" fill="#FFFFFF"/>
          <line x1="116" y1="0" x2="116" y2="220" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="142" y1="0" x2="142" y2="220" stroke="#CBD5E1" stroke-width="1"/>

          <rect x="278" y="0" width="26" height="220" fill="#FFFFFF"/>
          <line x1="278" y1="0" x2="278" y2="220" stroke="#CBD5E1" stroke-width="1"/>
          <line x1="304" y1="0" x2="304" y2="220" stroke="#CBD5E1" stroke-width="1"/>

          <!-- Intersecciones limpias -->
          <rect x="116.5" y="70.5" width="25" height="21" fill="#FFFFFF"/>
          <rect x="278.5" y="70.5" width="25" height="21" fill="#FFFFFF"/>
          <rect x="116.5" y="146.5" width="25" height="21" fill="#FEF08A"/>
          <rect x="278.5" y="146.5" width="25" height="21" fill="#FEF08A"/>

          <!-- Pequeños marcadores de otros negocios cercanos (discretos) -->
          <!-- Café / Restaurante -->
          <g transform="translate(86, 118)">
            <circle cx="0" cy="0" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
          </g>
          <!-- Tienda -->
          <g transform="translate(336, 118)">
            <circle cx="0" cy="0" r="8" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
          </g>
          <!-- Servicio -->
          <g transform="translate(178, 41)">
            <circle cx="0" cy="0" r="7.5" fill="#6366F1" stroke="#FFFFFF" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="2.2" fill="#FFFFFF"/>
          </g>

          <!-- Onda de radar activa en el negocio central -->
          <circle cx="210" cy="128" r="14" fill="#EA4335" class="pin-pulse"/>
          <!-- Sombra base fija en el suelo del negocio -->
          <ellipse cx="210" cy="128" rx="9" ry="3.5" fill="#0033A0" opacity="0.28"/>

          <!-- GOTA / PIN DE UBICACIÓN ROJO DE GOOGLE MAPS SOBRE EL NEGOCIO -->
          <g class="pin-float" filter="url(#pinShadow)">
            <path d="M210 42 C188.5 42 171 59.5 171 81 C171 108.5 210 128 210 128 C210 128 249 108.5 249 81 C249 59.5 231.5 42 210 42 Z"
                  fill="url(#redPinGrad)"
                  stroke="#FFFFFF"
                  stroke-width="2.5"/>
            <!-- Círculo blanco interior del pin -->
            <circle cx="210" cy="80" r="13.5" fill="#FFFFFF"/>
            <!-- Punto rojo central sutil -->
            <circle cx="210" cy="80" r="5" fill="#C5221F"/>
          </g>

          <!-- Etiqueta flotante limpia "Tu Negocio" junto al pin -->
          <g transform="translate(248, 66)">
            <rect x="0" y="0" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#D6E6FF" stroke-width="1.5"/>
            <circle cx="14" cy="13" r="4.5" fill="#22C55E"/>
            <text x="24" y="17" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0033A0">Tu Negocio</text>
          </g>
        </svg>
      </div>
    </section>

    <!-- 3. SEGUNDO TEXTO DESCRIPTIVO -->
    <section class="w-full max-w-3xl shrink-0 px-1">
      <p class="headline-sub font-bold text-[#0033A0]">
        Gestionamos, promovemos y contestamos las reseñas que tus clientes dejan en tu perfil 
        de <span class="text-[#1E64E8] font-extrabold">Google Maps</span>, 
        para que tu negocio tenga mas visitas en
         <span class="text-[#1E64E8] font-extrabold">Google Maps</span> <br>
         Por 12 pesos diarios.
      </p>
    </section>

    <!-- 4. ENLACE / BOTÓN INFERIOR HACIA CENTROWEB.HTML -->
    <footer class="w-full max-w-md shrink-0 pt-1">
      <a href="centroweb.html"
         class="cta-text group inline-flex items-center justify-center gap-2.5 w-full sm:w-auto px-7 sm:px-9 py-3.5 sm:py-4 rounded-2xl bg-[#0033A0] hover:bg-[#0044CC] active:scale-[0.98] text-white font-extrabold tracking-tight shadow-[0_10px_25px_rgba(0,51,160,0.32)] transition-all duration-200 border-2 border-[#1E64E8]">
        <span>Dale clic aquí para mas informacion</span>
        <svg class="w-5 h-5 sm:w-6 sm:h-6 transition-transform duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </a>
    </footer>

  </main>

</body>
</html>
